<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Personnaliser ma barre</title>
<style>
:root {
  --bg: #ececec; --panneau: #f7f7f7; --champ: #ffffff; --bord: #d2d2d4; --filet: #e3e3e5;
  --texte: #1d1d1f; --texte2: #65656b; --accent: #0a60ff; --accent-texte: #ffffff;
  --erreur: #b3261e; --erreur-fond: #fbeae8; --ok: #2f7a3a;
  --tb-fond: #000; --tb-bouton: #363636; --tb-bouton-survol: #4a4a4a; --tb-texte: #fff;
  --radius: 6px; --m: 20px;
  color-scheme: light dark;
}
@supports (color: AccentColor) { :root { --accent: AccentColor; } }
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #262628; --panneau: #1e1e20; --champ: #2c2c2e; --bord: #3c3c3f; --filet: #333336;
    --texte: #f2f2f4; --texte2: #a4a4aa; --erreur: #ff6b5e; --erreur-fond: #3a1f1c; --ok: #5fcf72;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  color: var(--texte); background: var(--bg);
  display: grid; grid-template-rows: auto auto 1fr; min-width: 1060px;
  -webkit-user-select: none; user-select: none;
}
input, select, textarea, button { font: inherit; color: inherit; }
input, select, textarea { -webkit-user-select: text; user-select: text; }
h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--texte2); margin: 0 0 8px; }
.aide { margin: 2px 0 0; color: var(--texte2); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); }

/* Boutons de l'interface */
button { cursor: default; border-radius: var(--radius); border: 1px solid var(--bord); background: var(--champ); min-height: 44px; padding: 0 14px; }
button:hover { background: color-mix(in srgb, var(--champ) 85%, var(--texte) 15%); }
button:active { background: color-mix(in srgb, var(--champ) 70%, var(--texte) 30%); }
button:disabled { opacity: 0.45; }
button.primaire { background: var(--accent); color: var(--accent-texte); border-color: transparent; font-weight: 600; }
button.primaire:hover { filter: brightness(0.95); background: var(--accent); }
button.secondaire { background: transparent; }
button.lien { border: 0; background: none; color: var(--accent); padding: 0 4px; min-height: 44px; }
button.lien:hover { background: none; text-decoration: underline; }

/* En-tête */
header { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--m); padding: 18px var(--m) 10px; }
.outils { display: flex; gap: 8px; align-items: center; }
.langues { display: inline-flex; border: 1px solid var(--bord); border-radius: var(--radius); overflow: hidden; }
.langues button { border: 0; border-radius: 0; min-width: 44px; }
.langues button + button { border-left: 1px solid var(--bord); }
.langues button[aria-pressed="true"] { background: var(--texte); color: var(--bg); }

/* Aperçu : la Touch Bar à l'échelle 1 */
.apercu { padding: 6px var(--m) 14px; border-bottom: 1px solid var(--bord); }
.scene { display: flex; justify-content: center; align-items: center; gap: 0; height: 60px; }
.touchbar {
  width: 1004px; height: 60px; background: var(--tb-fond); border-radius: 8px;
  display: flex; align-items: center; gap: 8px; padding: 0 8px; position: relative; flex: none;
  color: var(--tb-texte);
}
.touchbar.courte { width: 685px; border-top-right-radius: 0; border-bottom-right-radius: 0; }
.strip { width: 319px; height: 60px; flex: none; background: #141414; border-radius: 0 8px 8px 0; color: #7a7a7a; font-size: 12px;
  display: none; align-items: center; justify-content: center; border-left: 1px solid #2a2a2a; }
.touchbar.courte + .strip { display: flex; }
.touchbar .vide { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #9a9a9a; font-size: 13px; pointer-events: none; }
.el { height: 60px; display: flex; align-items: center; flex: none; position: relative; border-radius: 8px; cursor: grab; }
.el[data-type="souple"] { flex: 1 1 24px; min-width: 24px; }
.el:focus-visible { outline: none; }
.el.sel .face, .el:focus-visible .face { outline: 2px solid var(--accent); outline-offset: 2px; }
.el.avant::before, .el.apres::after { content: ""; position: absolute; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--accent); }
.el.avant::before { left: -6px; } .el.apres::after { right: -6px; }
.el.glisse { opacity: 0.4; }
.face { height: 30px; min-width: 56px; padding: 0 14px; border-radius: 6px; background: var(--tb-bouton); color: var(--tb-texte);
  display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; white-space: nowrap; overflow: hidden; }
.el:hover .face { background: var(--tb-bouton-survol); }
.face.plat { background: transparent; }
.el[data-type="souple"] .face { height: 30px; background: transparent; width: 100%; min-width: 0; padding: 0; }
.el[data-type="souple"] .face::before { content: "⟷"; color: #5a5a5a; font-size: 14px; }
.el[data-type="espace"] .face { background: transparent; border: 1px dashed #4a4a4a; min-width: 0; padding: 0; }
.face.mono { font-family: "SF Mono", Menlo, monospace; font-size: 13px; color: #d0d0d0; }
.sf { display: inline-block; width: 17px; height: 17px; background: currentColor; -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; flex: none; }
.sf.inconnu { width: auto; height: auto; background: none; -webkit-mask: none; mask: none; font-size: 11px; color: #ff8a80; overflow: hidden; text-overflow: ellipsis; }
.chevron { color: #9a9a9a; font-size: 13px; }
.bas { display: flex; justify-content: space-between; align-items: center; gap: var(--m); margin-top: 10px; min-height: 44px; }
.etat { margin: 0; min-height: 20px; flex: 1; }
.etat.erreur { color: var(--erreur); background: var(--erreur-fond); border: 1px solid color-mix(in srgb, var(--erreur) 40%, transparent); border-radius: var(--radius); padding: 10px 12px; font-weight: 500; }
.etat.ok { color: var(--ok); }
.case { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 4px; }
.case input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }

/* Corps : palette + propriétés */
main { display: grid; grid-template-columns: 240px 1fr; min-height: 0; }
.palette { background: var(--panneau); border-right: 1px solid var(--bord); padding: 16px; overflow: auto; }
.palette .liste { display: grid; gap: 6px; margin-bottom: 22px; }
.palette .liste button { display: flex; align-items: center; gap: 10px; text-align: left; justify-content: flex-start; padding: 0 12px; }
.palette .liste button .ico { width: 22px; text-align: center; color: var(--texte2); font-size: 15px; flex: none; }
.proprietes { padding: 16px var(--m) 24px; overflow: auto; }
.proprietes .ligne { display: grid; grid-template-columns: 170px 1fr; gap: 12px; align-items: center; min-height: 44px; border-bottom: 1px solid var(--filet); padding: 4px 0; }
.proprietes .ligne.haute { align-items: start; padding-top: 10px; }
.proprietes label.nom, .proprietes .nom { color: var(--texte2); }
.proprietes input[type="text"], .proprietes input[type="search"], .proprietes input[type="number"], .proprietes select, .proprietes textarea {
  width: 100%; max-width: 480px; min-height: 36px; padding: 6px 10px; border: 1px solid var(--bord); border-radius: var(--radius); background: var(--champ);
}
.proprietes textarea { font-family: "SF Mono", Menlo, monospace; font-size: 12px; resize: vertical; min-height: 60px; }
.proprietes input[type="color"] { width: 44px; height: 36px; padding: 2px; border: 1px solid var(--bord); border-radius: var(--radius); background: var(--champ); vertical-align: middle; }
.proprietes input[type="range"] { width: 240px; accent-color: var(--accent); vertical-align: middle; }
.cote { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.cote .valeur { min-width: 48px; font-variant-numeric: tabular-nums; }
.entete { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 6px; }
.entete h2 { margin: 0; font-size: 15px; text-transform: none; letter-spacing: 0; color: var(--texte); }
.entete .actions { display: flex; gap: 6px; }
.entete .actions button { min-width: 44px; padding: 0 10px; }
.grille { display: grid; grid-template-columns: repeat(auto-fill, 44px); gap: 6px; margin-top: 8px; max-width: 480px; }
.grille button { width: 44px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center; }
.grille button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.grille .sf { width: 20px; height: 20px; }
.exemple { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 36px; background: var(--tb-fond); color: #fff; border-radius: var(--radius); margin-right: 8px; vertical-align: middle; }
.sous { margin: 6px 0 0; padding: 0; list-style: none; max-width: 480px; }
.sous li { display: flex; align-items: center; gap: 8px; min-height: 44px; border-bottom: 1px solid var(--filet); }
.sous li .quoi { flex: 1; }
.sous li button { min-height: 36px; padding: 0 10px; }
.vide-props { color: var(--texte2); max-width: 46ch; margin-top: 40px; }
.explication { color: var(--texte2); font-size: 12px; margin: 4px 0 0; max-width: 480px; }
.explication .alerte { color: var(--erreur); }
.explication button.lien { min-height: 32px; font-size: 12px; }

/* Changements non enregistrés : un point à côté du titre, comme le bouton rouge de la fenêtre */
.modifie { display: inline-flex; align-items: center; gap: 6px; margin-left: 10px; font-size: 12px; font-weight: 500; color: var(--texte2); vertical-align: 3px; }
.modifie::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.modifie[hidden] { display: none; }

/* Fichier illisible : l'erreur prend la place des réglages */
.illisible { max-width: 620px; }
.illisible h2 { font-size: 15px; text-transform: none; letter-spacing: 0; color: var(--texte); margin: 4px 0 10px; }
.illisible .etat p { margin: 0; }
.illisible pre { margin: 8px 0 0; font: 12px/1.4 "SF Mono", Menlo, monospace; white-space: pre-wrap; word-break: break-all; color: var(--texte); }
.illisible > p { color: var(--texte2); max-width: 62ch; margin: 12px 0 0; }
.illisible .cote { margin-top: 16px; }
.palette button:disabled, .case:has(input:disabled) { opacity: 0.45; }

/* Confirmation dans la page : <dialog> modal, Échap = Annuler */
dialog { border: 0; border-radius: 10px; padding: 20px 20px 16px; width: min(440px, calc(100vw - 32px)); background: var(--panneau); color: var(--texte);
  box-shadow: 0 12px 40px rgb(0 0 0 / 0.28); }
dialog::backdrop { background: rgb(0 0 0 / 0.25); }
dialog h2 { font-size: 15px; text-transform: none; letter-spacing: 0; color: var(--texte); margin: 0 0 6px; }
dialog p { margin: 0; color: var(--texte2); }
dialog .choix { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
dialog .choix .gauche { margin-right: auto; }
@media (prefers-reduced-motion: no-preference) {
  .face, button { transition: background-color 120ms cubic-bezier(0.22, 1, 0.36, 1); }
}
</style>
</head>

<header>
  <div>
    <h1><span data-i18n="titre">Personnaliser ma barre</span><span class="modifie" id="badge-modifie" data-i18n="modifieBadge" hidden></span></h1>
    <p class="aide" data-i18n="sousTitre"></p>
  </div>
  <div class="outils">
    <div class="langues" role="group" aria-label="Langue / Language">
      <button type="button" data-langue="fr" aria-pressed="true">FR</button>
      <button type="button" data-langue="en" aria-pressed="false">EN</button>
    </div>
    <button type="button" id="revenir" class="secondaire" data-i18n="revenir" disabled></button>
    <button type="button" id="enregistrer" class="primaire" data-i18n="enregistrer"></button>
  </div>
</header>

<section class="apercu">
  <div class="scene">
    <div class="touchbar" id="barre" role="listbox" aria-label="Touch Bar"></div>
    <div class="strip" aria-hidden="true" data-i18n="controlStrip"></div>
  </div>
  <div class="bas">
    <p class="etat" id="etat" role="status" aria-live="polite"></p>
    <label class="case"><input type="checkbox" id="masquer"> <span data-i18n="masquerCS"></span></label>
  </div>
</section>

<main>
  <aside class="palette">
    <h2 data-i18n="ajouter"></h2>
    <div class="liste" id="ajouts"></div>
    <h2 data-i18n="preregles"></h2>
    <div class="liste" id="preregles"></div>
  </aside>
  <section class="proprietes" id="proprietes" aria-live="polite"></section>
</main>

<dialog id="confirmation" aria-labelledby="conf-titre" aria-describedby="conf-texte">
  <h2 id="conf-titre"></h2>
  <p id="conf-texte"></p>
  <div class="choix" id="conf-choix"></div>
</dialog>

  else if (ui.mode === 'autre') detail = `<p class="explication">${esc(JSON.stringify(ui.valeur))}</p>`;
  else if (ui.mode === 'luminosite_fixe' || ui.mode === 'volume_fixe') detail = `<div class="cote"><input type="range" min="0" max="100" step="5" data-action-valeur="${cle}" value="${Math.round((ui.valeur ?? 0.5) * 100)}" aria-label="${t('niveau')}"><span class="valeur">${Math.round((ui.valeur ?? 0.5) * 100)} %</span></div>`;
  return `<div class="ligne${detail ? ' haute' : ''}"><label class="nom" for="act-${cle}">${label}</label><div><select id="act-${cle}" data-action-mode="${cle}">${options.map(([v, l]) => `<option value="${v}"${v === ui.mode ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>${detail ? `<div style="margin-top:8px">${detail}</div>` : ''}</div></div>`;
}
/* Nom d'app tapé à la main : Rust dit s'il existe et propose le plus proche (« Photoshop » → « Adobe Photoshop 2025 »). */
let minuteurApp = null;
function verifierApp(cle) {
  const p = $(`app-${cle}`), e = elem(); if (!p || !e) return;
  const nom = String(actionUI(e[cle]).valeur || '').trim();
  const r = apps[nom];
  if (!nom || !r || r.trouvee) {
    p.innerHTML = '';
    if (nom && !r) { clearTimeout(minuteurApp); minuteurApp = setTimeout(() => envoyer({ type: 'verifierApp', nom }), 300); }
    return;
  }
  p.innerHTML = `<span class="alerte">${esc(t('appIntrouvable').replace('{a}', nom))}</span> `
    + (r.suggestion ? `${esc(t('appProche'))} <button type="button" class="lien" data-app-suggestion="${cle}" data-nom="${esc(r.suggestion)}">${esc(t('appUtiliser').replace('{s}', r.suggestion))}</button> ` : '')
    + esc(t('appConseil'));
}
function panneauIllisible() {
  return `<div class="illisible"><h2>${esc(t('illisibleTitre'))}</h2>
    <div class="etat erreur" role="alert"><p>${esc(illisible.message)}</p>${illisible.extrait ? `<pre>${esc(illisible.extrait)}</pre>` : ''}</div>
    <p>${esc(t('illisibleTexte'))}</p><p>${esc(t('illisibleIssue'))}</p>
    <div class="cote"><button type="button" id="i-ouvrir" class="primaire">${esc(t('ouvrirFichier'))}</button><button type="button" id="i-relire">${esc(t('relire'))}</button><button type="button" id="i-repartir">${esc(t('repartir'))}</button></div></div>`;
}
let rechercheSymbole = '';
function champSymbole(e) {
  const nom = e.symbole || '';
  const q = rechercheSymbole.trim().toLowerCase();
  const liste = (q ? SYMBOLES.filter(s => s.includes(q)) : SYMBOLES).slice(0, 48);
  if (nom && !(nom in glyphes)) demanderGlyphes([nom]);
  return `<div class="ligne haute"><span class="nom" id="lbl-symbole">${t('symbole')}</span><div>
    <div class="cote"><span class="exemple" aria-hidden="true">${nom ? sf(nom) : '<span style="color:#777">—</span>'}</span>
      <input type="text" id="symbole-nom" value="${esc(nom)}" aria-label="${t('nomSymbole')}" placeholder="play.fill" spellcheck="false" style="max-width:260px">
      <button type="button" id="symbole-aucun" class="secondaire">${t('aucunSymbole')}</button></div>
    ${nom && glyphes[nom] === null ? `<p class="explication" style="color:var(--erreur)">${t('symboleInconnu')}</p>` : ''}
    <input type="search" id="symbole-recherche" value="${esc(rechercheSymbole)}" placeholder="${esc(t('chercherSymbole'))}" aria-label="${esc(t('chercherSymbole'))}" style="margin-top:10px">
    <div class="grille" role="listbox" aria-labelledby="lbl-symbole">${liste.map(s => `<button type="button" role="option" data-symbole="${s}" title="${s}" aria-label="${s}" aria-pressed="${s === nom}">${sf(s)}</button>`).join('')}</div>
  </div></div>`;
}
function ligne(label, html, id) { return `<div class="ligne"><label class="nom" for="${id}">${label}</label><div>${html}</div></div>`; }
function texteChamp(id, cle, valeur, placeholder, aide) {
  return ligne(t(cle), `<input type="text" id="${id}" data-champ="${cle}" value="${esc(valeur ?? '')}" placeholder="${esc(placeholder || '')}">${aide ? `<p class="explication">${esc(aide)}</p>` : ''}`, id);
}
function couleurChamp(cle, valeur, defaut, libelleAuto) {
  return ligne(t(cle), `<div class="cote"><input type="color" id="f-${cle}" data-couleur="${cle}" value="${esc(valeur || defaut)}" aria-label="${t(cle)}"><label class="case"><input type="checkbox" id="f-${cle}-auto" data-couleur-auto="${cle}" ${valeur ? '' : 'checked'}> ${libelleAuto}</label></div>`, 'f-' + cle);
}
function nombreChamp(cle, valeur, min, step, aide, optionnel) {
  return ligne(t(cle), `<div class="cote"><input type="number" id="n-${cle}" data-champ="${cle}" data-nombre="${optionnel ? 'opt' : 'req'}" value="${valeur ?? ''}" min="${min}" step="${step}" placeholder="${optionnel ? esc(t('auto')) : ''}" style="max-width:140px">${aide ? `<span class="explication">${esc(aide)}</span>` : ''}</div>`, 'n-' + cle);
}
function dessinerProprietes(reconstruire) {
  const p = $('proprietes');
  const e = elem();
  if (illisible) { if (reconstruire) p.innerHTML = panneauIllisible(); return; }
  if (!e) { p.innerHTML = `<p class="vide-props">${esc(t('rien'))}</p>`; return; }
  if (!reconstruire && !p.querySelector('.grille')) return; // seule la grille de symboles dépend des glyphes
  const focus = document.activeElement?.id;
  const l = liste(), k = index();
  let html = `<div class="entete"><h2>${esc(t(e.type))}${sel.j != null ? ` <span class="nom">· ${esc(t('groupe'))}</span>` : ''}</h2>
    <div class="actions"><button type="button" id="p-gauche" aria-label="${t('gauche')}" title="${t('gauche')}" ${k === 0 ? 'disabled' : ''}>◀</button><button type="button" id="p-droite" aria-label="${t('droite')}" title="${t('droite')}" ${k >= l.length - 1 ? 'disabled' : ''}>▶</button><button type="button" id="p-supprimer">${t('supprimer')}</button></div></div>`;
  if (sel.j != null) html += `<button type="button" class="lien" id="p-retour">${t('retourGroupe')}</button>`;
  switch (e.type) {
    case 'bouton':
      html += texteChamp('f-texte', 'texte', e.texte, '') + champSymbole(e)
        + (e.image ? ligne(t('image'), `<p class="explication" style="margin:0">${esc(e.image)}</p>`, '') : '')
        + couleurChamp('couleur', e.couleur, '#363636', t('couleurAuto')) + couleurChamp('couleur_texte', e.couleur_texte, '#ffffff', t('couleurTexteAuto'))
        + nombreChamp('taille', e.taille, 8, 1, '', true)
        + ligne(t('affichage'), `<select id="f-affichage" data-champ="affichage">${[['', t('auto')], ['icone', t('affIcone')], ['texte', t('affTexte')], ['les_deux', t('affLesDeux')]].map(([v, l]) => `<option value="${v}"${(e.affichage || '') === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`, 'f-affichage')
        + nombreChamp('largeur', e.largeur, 20, 4, langue === 'fr' ? 'la barre fait 1004 points' : 'the bar is 1004 points wide', true)
        + champAction('action', t('action')) + champAction('appui_long', t('appuiLong'));
      break;
    case 'slider':
      html += ligne(t('reglage'), `<select id="f-reglage" data-champ="reglage"><option value="luminosite"${e.reglage === 'luminosite' ? ' selected' : ''}>${t('luminosite')}</option><option value="volume"${e.reglage === 'volume' ? ' selected' : ''}>${t('volume')}</option></select>`, 'f-reglage') + champSymbole(e);
      break;
    case 'heure': html += texteChamp('f-format', 'format', e.format, 'HH:mm', t('formatAide')); break;
    case 'en_cours': html += nombreChamp('largeur', e.largeur, 60, 10, '', true); break;
    case 'script':
      html += ligne(t('commande'), `<textarea id="f-commande" data-champ="commande" rows="2" spellcheck="false">${esc(e.commande)}</textarea><p class="explication">${esc(t('commandeAide'))}</p>`, 'f-commande')
        + nombreChamp('intervalle', e.intervalle, 0.1, 1, '', false) + nombreChamp('delai', e.delai, 0.1, 1, '5', true) + nombreChamp('largeur', e.largeur, 20, 4, '120', true) + champAction('action', t('action'));
      break;
    case 'espace': html += nombreChamp('largeur', e.largeur, 4, 4, '', false); break;
    case 'batterie': html += ligne('', `<label class="case"><input type="checkbox" id="f-pile" ${e.symbole === false ? '' : 'checked'}> ${t('symbolePile')}</label>`, 'f-pile') + nombreChamp('largeur', e.largeur, 40, 4, '', true); break;
    case 'souple': html += `<p class="explication">${langue === 'fr' ? 'Prend toute la place libre : deux espaces souples centrent ce qui est entre eux.' : 'Takes all the free space: two flexible spaces center what is between them.'}</p>`; break;
    case 'groupe':
      html += texteChamp('f-texte', 'texte', e.texte, '') + champSymbole(e) + nombreChamp('largeur', e.largeur, 40, 4, '', true)
        + `<div class="ligne haute"><span class="nom">${t('contenu')}</span><div><ul class="sous">${e.element.map((s, j) => `<li><span class="ico" aria-hidden="true">${ICONES[s.type]}</span><span class="quoi">${esc(t(s.type))}${s.texte ? ' · ' + esc(s.texte) : s.symbole ? ' · ' + esc(s.symbole) : ''}</span><button type="button" data-sous="${j}">${t('regler')}</button></li>`).join('')}</ul>
          <select id="f-ajout-groupe" aria-label="${t('ajouterDans')}" style="margin-top:8px"><option value="">${t('ajouterDans')}</option>${['bouton', 'slider', 'heure', 'en_cours', 'script', 'batterie', 'espace', 'souple'].map(ty => `<option value="${ty}">${esc(t(ty))}</option>`).join('')}</select></div></div>`;
      break;
  }
  p.innerHTML = html;
  ['action', 'appui_long'].forEach(verifierApp);
  if (focus && $(focus)) { const f = $(focus); f.focus(); if (f.setSelectionRange && f.type !== 'number') { const n = f.value.length; try { f.setSelectionRange(n, n); } catch (_) {} } }
}
$('proprietes').addEventListener('input', ev => {
  const e = elem(); if (!e) return;
  const c = ev.target;
  if (c.dataset.champ) {
    if (c.dataset.nombre) { const v = parseFloat(c.value); if (c.dataset.nombre === 'opt' && c.value === '') delete e[c.dataset.champ]; else if (!isNaN(v)) e[c.dataset.champ] = v; }
    else if (c.value === '' && c.dataset.champ !== 'commande') delete e[c.dataset.champ];
    else e[c.dataset.champ] = c.value;
    changer(); return;
  }
  if (c.dataset.couleur) { e[c.dataset.couleur] = c.value; $(`f-${c.dataset.couleur}-auto`).checked = false; changer(); return; }
  if (c.dataset.couleurAuto) { const k = c.dataset.couleurAuto; if (c.checked) delete e[k]; else e[k] = $(`f-${k}`).value; changer(); return; }
  if (c.id === 'f-pile') { if (c.checked) delete e.symbole; else e.symbole = false; changer(); return; }
  if (c.id === 'symbole-nom') { if (c.value.trim()) e.symbole = c.value.trim(); else delete e.symbole; demanderGlyphes([e.symbole]); changer(); dessinerProprietes(true); return; }
  if (c.id === 'symbole-recherche') { rechercheSymbole = c.value; dessinerProprietes(true); return; }
  if (c.dataset.actionMode) { e[c.dataset.actionMode] = actionModele(c.value, undefined); if (e[c.dataset.actionMode] === undefined) delete e[c.dataset.actionMode]; changer(); dessinerProprietes(true); return; }
  if (c.dataset.actionValeur) {
    const cle = c.dataset.actionValeur, mode = actionUI(e[cle]).mode;
    const v = c.type === 'range' ? +c.value / 100 : c.value;
    e[cle] = actionModele(mode, v);
    if (c.type === 'range') c.parentElement.querySelector('.valeur').textContent = `${c.value} %`;
    changer();
    if (mode === 'app') verifierApp(cle);
  }
});
$('proprietes').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.id === 'i-ouvrir') return envoyer({ type: 'ouvrirFichier' });
  if (b.id === 'i-relire') return envoyer({ type: 'relire' });
  if (b.id === 'i-repartir') return prereglage('musique');
  const e = elem(); if (!e) return;
  if (b.dataset.appSuggestion) { e[b.dataset.appSuggestion] = { app: b.dataset.nom }; changer(); dessinerProprietes(true); return; }
  if (b.id === 'p-supprimer') supprimer();
  else if (b.id === 'p-gauche') deplacer(-1);
  else if (b.id === 'p-droite') deplacer(1);
  else if (b.id === 'p-retour') selectionner({ i: sel.i });
  else if (b.id === 'symbole-aucun') { delete e.symbole; changer(); dessinerProprietes(true); }
  else if (b.dataset.symbole) { e.symbole = b.dataset.symbole; changer(); dessinerProprietes(true); }
  else if (b.dataset.sous != null) selectionner({ i: sel.i, j: +b.dataset.sous });
  else if (b.dataset.choisirApp) { champActionEnCours = b.dataset.choisirApp; envoyer({ type: 'choisirApp' }); }
});
$('proprietes').addEventListener('change', ev => {
  if (ev.target.id === 'f-ajout-groupe' && ev.target.value) ajouter(ev.target.value, true);
});

/* ---------- Haut de page ---------- */
$('masquer').addEventListener('change', ev => { barre.masquer_control_strip = ev.target.checked; changer(); });
$('enregistrer').addEventListener('click', () => enregistrer(false));
$('revenir').addEventListener('click', async () => {
  const r = await confirmer(t('confRevenir'), t('confRevenirTexte') + (modifie ? ' ' + t('perdues') : ''), [['annuler', t('annuler')], ['oui', t('revenirCourt'), 'primaire']]);
  if (r === 'oui') envoyer({ type: 'revenir' });
});
document.addEventListener('keydown', ev => { if ((ev.metaKey || ev.ctrlKey) && ev.key === 's') { ev.preventDefault(); enregistrer(false); } });
document.querySelectorAll('[data-langue]').forEach(b => b.addEventListener('click', () => { langue = b.dataset.langue; try { localStorage.setItem('langue', langue); } catch (_) {} traduire(); }));
function traduire() {
  document.documentElement.lang = langue;
  document.querySelectorAll('[data-i18n]').forEach(n => { n.textContent = t(n.dataset.i18n); });
  document.querySelectorAll('[data-langue]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.langue === langue)));
  envoyer({ type: 'titre', texte: t('titreFenetre') });
  tout();
  if (modifie) etat(t('modifie'));
}
// L'heure vit sans redessiner la barre : un redessin ferait perdre le focus et le glisser en cours.
setInterval(() => {
  barre.element.forEach((e, i) => { if (e.type === 'heure') { const f = $('barre').querySelector(`.el[data-i="${i}"] .face`); if (f) f.textContent = heure(e.format || 'HH:mm'); } });
}, 1000);

traduire();
demanderGlyphes(SYMBOLES);
envoyer({ type: 'pret' });
</script>
</body>
