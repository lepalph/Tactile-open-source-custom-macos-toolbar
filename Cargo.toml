[package]
name = "tactile"
version = "0.2.0"
edition = "2024"
description = "A customizable Touch Bar for macOS, described in a TOML file (MTMR / BetterTouchTool alternative)"
license = "MIT"
repository = "https://github.com/lepalph/tactile-touch-bar"
readme = "README.md"
keywords = ["touchbar", "touch-bar", "macos", "mtmr", "appkit"]
categories = ["os::macos-apis", "gui", "command-line-utilities"]

[dependencies]
objc2 = { version = "0.6", features = ["catch-all"] }
block2 = "0.6"
objc2-foundation = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
