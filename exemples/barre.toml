# Barre par défaut de Tactile. Pour la modifier, copie ce fichier dans ~/.config/tactile/barre.toml.
# Les éléments s'affichent de gauche à droite, dans l'ordre du fichier.
# Tactile recharge ce fichier dès qu'il est enregistré.

# Cache la bande de boutons système d'Apple, à droite.
masquer_control_strip = true

#  Rend la barre d'Apple (boutons propres à chaque app) ; l'icône ✳ du Control Strip ramène celle-ci.
[[element]]
type = "bouton"
symbole = "apple.logo"
largeur = 56
action = "barre_apple"

# Curseur de luminosité de l'écran.
[[element]]
type = "slider"
reglage = "luminosite"
symbole = "sun.max.fill"

# Curseur du volume.
[[element]]
type = "slider"
reglage = "volume"
symbole = "speaker.wave.2.fill"

# Espace souple : pousse la suite vers le centre.
[[element]]
type = "souple"

# ⏪ Morceau précédent.
[[element]]
type = "bouton"
symbole = "backward.fill"
action = "precedent"

# Titre en cours de lecture (largeur en points).
[[element]]
type = "en_cours"
largeur = 330

# ⏩ Morceau suivant.
[[element]]
type = "bouton"
symbole = "forward.fill"
action = "suivant"

# Espace souple : pousse la suite vers la droite.
[[element]]
type = "souple"

# Heure (HH = heures, mm = minutes).
[[element]]
type = "heure"
format = "HH:mm"
